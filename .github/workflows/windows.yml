name: Windows derlemesi

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Etiket ile sürüm numarası aynı mı
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne $cargo -or $tag -ne $conf) { throw "Etiket $tag, Cargo.toml $cargo, tauri.conf.json $conf: hepsi aynı olmalı" }

      - name: Paketleri kur
        run: npm ci

      - name: Arayüz tür denetimi
        run: npx tsc --noEmit

      - name: Rust testleri
        working-directory: src-tauri
        run: cargo test

      - name: Kurulum dosyasını derle
        run: npx tauri build

      - name: Kurulum dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: FABE-Anons-kurulum
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # "vX.Y.Z" etiketi gönderilince: GitHub sürümü + uygulamanın okuduğu latest.json
      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "FABE-Anons-$ver-kurulum.exe"
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName $name
          $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$name"
          git fetch --tags --force
          $notes = (git tag -l --format='%(contents)' $env:GITHUB_REF_NAME | Out-String).Trim()
          if (-not $notes) { $notes = "FABE Anons $ver" }
          @{ version = $ver; notes = $notes; url = $url; sha256 = $sha } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM latest.json
          gh release create $env:GITHUB_REF_NAME $name latest.json --title "FABE Anons $ver" --notes $notes
